# Netlify: publica a versão da nuvem a partir deste repositório.
# Cada envio para a branch main dispara: verificação completa -> construção -> publicação.
# Se a verificação falhar, o Netlify não publica e a versão anterior continua no ar.
[build]
  command = "node scripts/verificar.mjs && node scripts/construir.mjs"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Prévias de pull requests e de outras branches passam pela mesma verificação.
[context.deploy-preview]
  command = "node scripts/verificar.mjs && node scripts/construir.mjs"
