<!-- V177 · Despesas de Entrega: página do MOTORISTA (só pelo celular dele).
     Mostra só o que é dele: o cadastro, os caminhões liberados, as viagens e os lançamentos. Tudo passa pelas funções
     do servidor (jb_mot_*), que conferem a sessão, o motorista, o caminhão, a viagem e o valor; a leitura direta do
     banco é recusada para login de motorista. Nenhuma senha fica guardada: a sessão fica só nesta aba
     (sessionStorage, some ao fechar a aba ou ao tocar em Sair). O rascunho do lançamento fica neste celular até ser enviado. -->
<style>
:root{--papel:#F2F8FB;--papel2:#F7FBFD;--branco:#FFFFFF;--linha:#D3E0E8;--linha2:#E4EDF2;--tinta:#10222E;--suave:#465A67;--fraco:#5F7381;
 --brasa:#0B74A8;--brasa2:#09628E;--brasa-bg:#E8F4FA;--brasa-bg2:#CFE7F3;--carvao:#0D3B57;
 --ok:#1D7A4E;--ok-bg:#E3F3EA;--at:#8F5A00;--at-bg:#FBF0D9;--pe:#B3271F;--pe-bg:#FCE8E6;--in:#28618A;--in-bg:#E3EEF6;--br:#7A4B00;--br-bg:#FFF4E0;
 --r:14px;--anel:0 0 0 3px rgba(11,116,168,.22);color-scheme:light}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;height:100%}
body{margin:0;min-height:100%;background:var(--papel);color:var(--tinta);font:16px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--brasa);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
svg.i{width:24px;height:24px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* topo */
.topo{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;background:var(--papel);border-bottom:1px solid transparent}
body.rolou .topo{border-bottom-color:var(--linha);box-shadow:0 8px 18px -16px rgba(16,34,46,.5)}
.topo .lg{width:40px;height:40px;border-radius:11px;flex:none;display:block}
.topo .tt{min-width:0;flex:1}
.topo .tt b{display:block;font-size:17px;font-weight:700;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topo .tt small{display:block;font-size:13px;color:var(--fraco);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topo .bt-ic{width:48px;height:48px;border-radius:12px;border:1px solid var(--linha);background:var(--branco);display:grid;place-items:center;color:var(--suave);cursor:pointer;flex:none;padding:0}
.topo .bt-ic:active{background:var(--linha2)}

main{max-width:560px;margin:0 auto;padding:6px 16px calc(96px + env(safe-area-inset-bottom,0px))}
body.sem-nav main{padding-bottom:calc(28px + env(safe-area-inset-bottom,0px))}
h1.tit{font-size:24px;line-height:1.15;margin:8px 0 4px;font-weight:800;letter-spacing:-.01em}
p.sub{margin:0 0 16px;color:var(--suave);font-size:15px}
h2.sec{font-size:13px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--fraco);margin:22px 2px 10px}

.cartao{background:var(--branco);border:1px solid var(--linha);border-radius:var(--r);padding:14px 16px;margin:0 0 12px}
.cartao.dest{border-color:var(--brasa-bg2);background:linear-gradient(180deg,var(--brasa-bg),var(--branco) 70%)}
.linha-ic{display:flex;gap:12px;align-items:flex-start}
.linha-ic>.ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--brasa-bg);color:var(--brasa);flex:none}
.linha-ic .tx{min-width:0;flex:1}
.linha-ic .tx b{display:block;font-size:16px;line-height:1.25}
.linha-ic .tx small{display:block;color:var(--suave);font-size:14px;margin-top:2px}
.rot{font-size:12.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--fraco);margin-bottom:6px}

/* botões */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;padding:12px 16px;border-radius:12px;border:1px solid var(--linha);background:var(--branco);font-size:16.5px;font-weight:700;cursor:pointer;text-decoration:none;color:var(--tinta);touch-action:manipulation}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--brasa);border-color:var(--brasa);color:#fff}
.btn.pri:active{background:var(--brasa2)}
.btn.sec{color:var(--brasa);border-color:var(--brasa-bg2);background:var(--brasa-bg)}
.btn.perigo{color:var(--pe);border-color:#F0C3BF;background:var(--pe-bg)}
.btn.peq{min-height:44px;font-size:15px;padding:8px 12px;width:auto}
.btn:disabled{opacity:.6;cursor:wait}
.btns{display:grid;gap:10px;margin:16px 0 0}
.btns.dois{grid-template-columns:1fr 1fr}

/* atalhos de despesa */
.atalhos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.atalho{display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;gap:10px;min-height:96px;padding:14px;border-radius:var(--r);border:1px solid var(--linha);background:var(--branco);cursor:pointer;text-align:left;touch-action:manipulation}
.atalho .ic{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;background:var(--brasa-bg);color:var(--brasa)}
.atalho b{font-size:15.5px;line-height:1.2}
.atalho.grande{grid-column:1/-1;flex-direction:row;align-items:center;justify-content:flex-start;gap:14px;min-height:76px;background:var(--brasa);border-color:var(--brasa);color:#fff}
.atalho.grande .ic{background:rgba(255,255,255,.18);color:#fff}
.atalho.grande b{font-size:18px}
.atalho:active{background:var(--linha2)}.atalho.grande:active{background:var(--brasa2)}

/* situação (texto + ícone: não depende só da cor) */
.st{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 10px 3px 7px;font-size:13px;font-weight:700;white-space:nowrap;line-height:1.3}
.st svg{width:15px;height:15px;stroke-width:2.4}
.st.ok{background:var(--ok-bg);color:var(--ok)}.st.at{background:var(--at-bg);color:var(--at)}.st.pe{background:var(--pe-bg);color:var(--pe)}
.st.in{background:var(--in-bg);color:var(--in)}.st.br{background:var(--br-bg);color:var(--br)}.st.nt{background:var(--linha2);color:var(--suave)}

/* lista de lançamentos */
.lista{display:grid;gap:8px}
.item{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 14px;border-radius:var(--r);border:1px solid var(--linha);background:var(--branco);cursor:pointer;text-align:left;width:100%}
.item .ic{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;background:var(--brasa-bg);color:var(--brasa)}
.item .tx{min-width:0}
.item .tx b{display:block;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .tx small{display:block;font-size:13px;color:var(--fraco);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .vl{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.item .vl b{font-size:16px;white-space:nowrap}
.vazio{padding:22px 16px;text-align:center;color:var(--suave);border:1px dashed var(--linha);border-radius:var(--r);background:var(--papel2)}

/* formulário */
.etapas{display:flex;gap:6px;margin:4px 0 16px}
.etapas i{flex:1;height:6px;border-radius:99px;background:var(--linha)}
.etapas i.on{background:var(--brasa)}
.cmp{margin:0 0 16px}
.cmp>label,.cmp>.lb{display:block;font-size:15px;font-weight:700;margin:0 0 7px}
.cmp>label small,.cmp>.lb small{font-weight:500;color:var(--fraco);font-size:13.5px}
.cmp input,.cmp select,.cmp textarea{width:100%;min-height:54px;padding:12px 14px;border:1px solid var(--linha);border-radius:12px;background:var(--branco);font-size:17px}
.cmp textarea{min-height:92px;resize:vertical;line-height:1.4}
.cmp input:focus,.cmp select:focus,.cmp textarea:focus{outline:none;border-color:var(--brasa);box-shadow:var(--anel)}
.cmp.erro input,.cmp.erro select,.cmp.erro textarea{border-color:var(--pe);background:var(--pe-bg)}
.cmp .msg{display:none;color:var(--pe);font-size:14px;font-weight:600;margin-top:6px}
.cmp.erro .msg{display:block}
.cmp .aj{display:block;color:var(--fraco);font-size:13.5px;margin-top:6px}
.valor{position:relative}
.valor>span{position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:24px;font-weight:700;color:var(--fraco);pointer-events:none}
.valor input{font-size:32px!important;font-weight:800;padding-left:58px!important;min-height:72px!important;letter-spacing:-.01em}
.duas{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fichas{display:flex;flex-wrap:wrap;gap:8px}
.ficha{min-height:48px;padding:10px 14px;border-radius:999px;border:1px solid var(--linha);background:var(--branco);font-size:15px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.ficha[aria-pressed="true"]{background:var(--brasa);border-color:var(--brasa);color:#fff}
.ficha.lg{border-radius:12px;width:100%;justify-content:flex-start;text-align:left}
.fotos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.previa{margin:12px 0 0;border:1px solid var(--linha);border-radius:var(--r);overflow:hidden;background:var(--papel2);position:relative}
.previa img{display:block;width:100%;max-height:360px;object-fit:contain;background:#0B0F12}
.previa .pdf{padding:22px;text-align:center;color:var(--suave)}
.previa .sit{display:flex;align-items:center;gap:8px;padding:10px 12px;font-size:14px;font-weight:600;border-top:1px solid var(--linha);background:var(--branco)}
.resumo{display:grid;gap:0;border:1px solid var(--linha);border-radius:var(--r);background:var(--branco);overflow:hidden}
.resumo>div{display:flex;justify-content:space-between;gap:12px;padding:11px 14px;border-bottom:1px solid var(--linha2);font-size:15px}
.resumo>div:last-child{border-bottom:0}
.resumo span{color:var(--suave)}.resumo b{text-align:right;min-width:0;overflow-wrap:anywhere}
.resumo .grande b{font-size:22px}
.aviso{border-radius:12px;padding:12px 14px;font-size:14.5px;margin:0 0 14px;display:flex;gap:10px;align-items:flex-start;border:1px solid transparent}
.aviso svg{width:22px;height:22px;margin-top:1px}
.aviso.pe{background:var(--pe-bg);color:var(--pe);border-color:#F0C3BF}
.aviso.at{background:var(--at-bg);color:var(--at);border-color:#F1D9A6}
.aviso.ok{background:var(--ok-bg);color:var(--ok);border-color:#B9E0C9}
.aviso.in{background:var(--in-bg);color:var(--in);border-color:#C3D8E8}
.conf{text-align:center;padding:18px 4px 6px}
.conf .ok{width:84px;height:84px;border-radius:50%;margin:0 auto 14px;display:grid;place-items:center;background:var(--ok-bg);color:var(--ok)}
.conf .ok svg{width:46px;height:46px;stroke-width:2.6}
.conf h1{font-size:24px;margin:0 0 6px}
.filtros{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;margin:0 -16px 6px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.filtros::-webkit-scrollbar{display:none}
.filtros .ficha{flex:none;min-height:42px;padding:8px 14px;font-size:14.5px}
.foto-doc{display:block;width:100%;border-radius:var(--r);border:1px solid var(--linha);background:#0B0F12;max-height:420px;object-fit:contain}
.hist{margin:0;padding:0;list-style:none;border-left:2px solid var(--linha);margin-left:8px}
.hist li{position:relative;padding:0 0 12px 16px;font-size:14px;color:var(--suave)}
.hist li::before{content:"";position:absolute;left:-7px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--branco);border:2px solid var(--brasa)}
.hist li b{color:var(--tinta)}

/* barra de baixo */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(3,1fr);background:var(--branco);border-top:1px solid var(--linha);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 24px -18px rgba(16,34,46,.45)}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;min-height:56px;border:0;background:none;border-radius:12px;color:var(--fraco);font-size:12.5px;font-weight:700;cursor:pointer;padding:6px 4px}
.nav button[aria-current="page"]{color:var(--brasa);background:var(--brasa-bg)}
body.sem-nav .nav{display:none}

/* recado rápido e sem conexão */
#recado{position:fixed;left:12px;right:12px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:60;display:flex;justify-content:center;pointer-events:none}
#recado div{pointer-events:auto;max-width:520px;background:#10222E;color:#fff;border-radius:12px;padding:12px 16px;font-size:15px;box-shadow:0 14px 30px -12px rgba(0,0,0,.5)}
#recado div.erro{background:var(--pe)}
body.sem-nav #recado{bottom:calc(18px + env(safe-area-inset-bottom,0px))}
#semrede{position:relative;z-index:25;background:var(--at-bg);color:var(--at);font-size:14px;font-weight:600;padding:calc(8px + env(safe-area-inset-top,0px)) 16px 8px;text-align:center;border-bottom:1px solid #F1D9A6}

/* janela (começar/encerrar viagem, pedir correção) */
.veu{position:fixed;inset:0;z-index:70;background:rgba(10,20,28,.5);display:flex;align-items:flex-end;justify-content:center}
.janela{width:100%;max-width:560px;max-height:92vh;overflow-y:auto;background:var(--papel);border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));box-shadow:0 -20px 40px -20px rgba(0,0,0,.5)}
.janela h2{font-size:20px;margin:0 0 6px}
.janela .puxa{width:44px;height:5px;border-radius:9px;background:var(--linha);margin:-6px auto 14px}

/* entrada */
.entrada{min-height:100vh;display:flex;flex-direction:column}
.entrada .f{flex:1;display:flex;justify-content:center;padding:calc(28px + env(safe-area-inset-top,0px)) 22px 20px}
.entrada form{width:100%;max-width:420px}
.entrada .m{display:flex;align-items:center;gap:12px;margin-bottom:28px}
.entrada .m img{width:52px;height:52px;border-radius:14px}
.entrada .m b{display:block;font-size:21px;font-weight:800;line-height:1.1}
.entrada .m span{display:block;font-size:14px;color:var(--fraco)}
.entrada h1{font-size:30px;line-height:1.1;margin:0 0 8px;font-weight:800;letter-spacing:-.015em}
.entrada h1 em{font-style:normal;color:var(--brasa)}
.entrada p.sub{font-size:16px}
.olho{position:absolute;right:5px;top:50%;transform:translateY(-50%);width:46px;height:46px;border:0;background:none;border-radius:10px;display:grid;place-items:center;color:var(--suave);cursor:pointer}
.cs{position:relative}.cs input{padding-right:56px!important}
.rodape{display:flex;align-items:center;justify-content:flex-start;gap:8px;margin-top:16px;font-size:13.5px;color:var(--fraco);text-align:left}
.carregando{display:grid;place-items:center;min-height:60vh;color:var(--suave);gap:12px;text-align:center}
.giro{width:38px;height:38px;border-radius:50%;border:4px solid var(--brasa-bg2);border-top-color:var(--brasa);animation:gira .9s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
</style>
</head>

  }
  function abrirPedido(id) {
    var d = DESP(id); if (!d) return;
    var h = '<h2>Pedir correção</h2><p class="sub">Lançamento nº ' + esc(d.numero || '—') + ' · ' + esc(TIPO(d.tipoDesp).l) + ' · ' + esc(moeda(d.valor)) + '. O escritório confere e corrige; o que estava antes fica guardado.</p>' +
      '<div class="cmp"><label for="jTxt">O que está errado?</label><textarea id="jTxt" maxlength="500" placeholder="Ex.: o valor certo é R$ 800,00"></textarea></div><div class="aviso pe msg-j" role="alert" hidden></div>' +
      '<div class="btns"><button type="button" class="btn pri" data-ok>Enviar pedido</button><button type="button" class="btn" data-fechar>Cancelar</button></div>';
    janela(h, async function (v) {
      var t = $('#jTxt', v).value.trim(); if (t.length < 5) throw erro('dados', 'Escreva o que precisa ser corrigido.');
      await rpc('jb_mot_pedir_correcao', { p: { id: id, texto: t } });
      await carregar(false); desenhar(); recado('Pedido enviado ao escritório.');
    });
  }

  /* ---------------- toques ---------------- */
  document.addEventListener('click', function (ev) {
    var n = ev.target.closest('[data-nav]');
    if (n && EU) { ev.preventDefault(); var nome = n.getAttribute('data-nav'); if (TELA.nome !== nome) ir(nome, null, TELA.nome === 'confirmacao'); return; }
    var b = ev.target.closest('[data-acao]'); if (!b || !EU) return;
    var a = b.getAttribute('data-acao'), id = b.getAttribute('data-id');
    if (a === 'sair') { if (confirm('Sair desta conta neste celular?')) sair(); return; }
    if (a === 'voltar') { if (ENVIANDO) return; if (TELA.nome === 'despesa' && voltarEtapa()) return; history.back(); return; }
    if (a === 'nova') { var r0 = lerRasc(); if (r0 && !confirm('Há um lançamento não enviado guardado neste celular. Começar outro e descartar aquele?')) { F = r0; F.erros = {}; F.fotoEstado = F.foto && F.foto.id ? 'ok' : ''; ir('despesa', null, TELA.nome === 'confirmacao'); return; } apagarRasc(); novoForm(b.getAttribute('data-tipo') || '', b.getAttribute('data-viagem') || ''); ir('despesa', null, TELA.nome === 'confirmacao'); return; }
    if (a === 'continuar') { var r1 = lerRasc(); if (r1) { F = r1; F.erros = {}; F.erroEnvio = ''; F.fotoEstado = F.foto && F.foto.id ? 'ok' : ''; ir('despesa'); } return; }
    if (a === 'descartar') { if (confirm('Descartar o lançamento não enviado?')) { apagarRasc(); F = null; desenhar(); } return; }
    if (a === 'tipo') { F.tipoDesp = b.getAttribute('data-tipo'); F.etapa = 1; passoForm(); return; }
    if (a === 'seguir') { seguir(); return; }
    if (a === 'enviar') { enviar(); return; }
    if (a === 'abrir') { ir('detalhe', { id: id }); return; }
    if (a === 'abrir-viagem') { ir('viagem', { id: id }); return; }
    if (a === 'corrigir') { var d = DESP(id); if (d) { formDe(d); ir('despesa'); } return; }
    if (a === 'pedir') { abrirPedido(id); return; }
    if (a === 'iniciar') { abrirIniciar(id || ''); return; }
    if (a === 'encerrar') { abrirEncerrar(id); return; }
    if (a === 'atualizar') { recarregar(false); return; }
    if (a === 'reenviar-foto') { subirFoto(); return; }
    if (a === 'tirar-foto') { if (F) { if (F.fotoUrl) { try { URL.revokeObjectURL(F.fotoUrl); } catch (e) {} } F.foto = null; F.fotoBlob = null; F.fotoUrl = ''; F.fotoEstado = ''; gravarRasc(); desenhar(); } return; }
    if (a === 'ver-arq') { (async function () { try { var r = await sb.storage.from('anexos').createSignedUrl(id, 600); if (r.data && r.data.signedUrl) window.open(r.data.signedUrl, '_blank', 'noopener'); } catch (e) { recado('Sem conexão para abrir o arquivo.', true); } })(); return; }
  });
  document.addEventListener('click', function (ev) {
    if (!F || TELA.nome !== 'despesa') return;
    var x;
    if ((x = ev.target.closest('[data-viagem-op]'))) { var vid = x.getAttribute('data-viagem-op'); F.semViagem = !vid; F.viagemId = vid; var vg = vid ? VIAG(vid) : null; if (vg && vg.veiculoId) F.veiculoId = vg.veiculoId; if (F.erros) { delete F.erros.viagem; delete F.erros.justificativa; } gravarRasc(); desenhar(); return; }
    if ((x = ev.target.closest('[data-forma]'))) { F.forma = x.getAttribute('data-forma'); gravarRasc(); $$('[data-forma]', app).forEach(function (b) { b.setAttribute('aria-pressed', String(b === x)); }); return; }
    if ((x = ev.target.closest('[data-origem]'))) { F.origem = x.getAttribute('data-origem'); gravarRasc(); $$('[data-origem]', app).forEach(function (b) { b.setAttribute('aria-pressed', String(b === x)); }); return; }
  });
  document.addEventListener('click', function (ev) { var f = ev.target.closest('[data-filtro]'); if (!f) return; FILTRO = f.getAttribute('data-filtro'); telaHistorico(); });
  window.addEventListener('online', function () { $('#semrede').hidden = true; });
  window.addEventListener('offline', function () { $('#semrede').hidden = false; });
  if (!navigator.onLine) $('#semrede').hidden = false;
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState !== 'visible') return;
    if (EU && Date.now() - ultimaCarga > 60000 && TELA.nome !== 'despesa') recarregar(true);
    conferirVersao();
  });

  /* versão nova publicada: atualiza sozinha quando não há nada sendo preenchido (o rascunho fica guardado de qualquer forma) */
  function conferirVersao() {
    var meta = document.querySelector('meta[name="jb-site"]'); if (!meta) return;
    fetch('versao.json', { cache: 'no-store' }).then(function (r) { return r.ok ? r.json() : null; }).then(function (j) {
      if (!j || !j.site || j.site === meta.getAttribute('content') || TELA.nome === 'despesa' || ENVIANDO || document.querySelector('.veu')) return;
      try { var k = 'jb_mot_recarga', a = JSON.parse(sessionStorage.getItem(k) || 'null'); if (a && a.para === j.site && Date.now() - a.em < 600000) return; sessionStorage.setItem(k, JSON.stringify({ para: j.site, em: Date.now() })); } catch (e) {}
      location.reload();
    }, function () {});
  }

  /* ---------------- entrada (usuário e senha) ---------------- */
  function campoEnt(id, rot, tipo, auto) {
    var i = '<input id="' + id + '" type="' + tipo + '" autocomplete="' + auto + '" required' + (tipo === 'text' ? ' autocapitalize="none" spellcheck="false"' : '') + '>';
    if (tipo === 'password') i = '<div class="cs">' + i + '<button type="button" class="olho" aria-label="Mostrar a senha" aria-pressed="false">' + ic('olho') + '</button></div>';
    return '<div class="cmp"><label for="' + id + '">' + esc(rot) + '</label>' + i + '</div>';
  }
  function caixa(tit, sub, campos, botao, aviso, ok) {
    document.body.classList.add('sem-nav');
    app.innerHTML = '<div class="entrada"><div class="f"><form novalidate><div class="m"><img src="icone.svg" alt="" width="52" height="52"><div><b>JB ERP</b><span>Motorista · Cerâmica Concretiza</span></div></div>' +
      '<h1>' + tit + '</h1><p class="sub">' + esc(sub) + '</p>' + campos + '<button type="submit" class="btn pri">' + esc(botao) + '</button>' +
      '<div class="aviso ' + (ok ? 'ok' : 'pe') + ' msg" role="status" aria-live="polite" style="margin-top:14px"' + (aviso ? '' : ' hidden') + '>' + esc(aviso || '') + '</div>' +
      '<div class="rodape">' + ic('cadeado') + '<span>Acesso só para motoristas cadastrados pelo escritório</span></div></form></div></div>';
    $$('.olho', app).forEach(function (o) { o.addEventListener('click', function () { var i = o.parentNode.querySelector('input'), m = i.type === 'password'; i.type = m ? 'text' : 'password'; o.setAttribute('aria-pressed', String(m)); o.setAttribute('aria-label', m ? 'Esconder a senha' : 'Mostrar a senha'); }); });
    var f = $('input', app); if (f) setTimeout(function () { try { f.focus(); } catch (e) {} }, 40);
    return $('form', app);
  }
  function mostrarMsg(f, t, ok) { var m = $('.msg', f); m.hidden = !t; m.className = 'aviso ' + (ok ? 'ok' : 'pe') + ' msg'; m.textContent = t || ''; }
  function telaEntrada(aviso, ok) {
    var f = caixa('Despesas de <em>entrega</em>', 'Entre com o usuário e a senha que o escritório passou para você.', campoEnt('eU', 'Usuário', 'text', 'username') + campoEnt('eS', 'Senha', 'password', 'current-password'), 'Entrar', aviso, ok);
    f.addEventListener('submit', async function (ev) {
      ev.preventDefault();
      var b = $('button[type=submit]', f), u = $('#eU', f).value.trim().toLowerCase(), s = $('#eS', f).value;
      if (!u || !s) { mostrarMsg(f, 'Informe usuário e senha.'); return; }
      b.disabled = true; b.textContent = 'Conferindo…'; mostrarMsg(f, '');
      try {
        var r = await post('login', { usuario: u, senha: s });
        $('#eS', f).value = '';
        if (r.trocarSenha) { telaTrocar(r); return; }
        b.textContent = 'Abrindo…';
        await abrirSessao(r);
      } catch (e) {
        var msg = e.message;
        if (/não é de motorista/i.test(msg)) msg = 'Este acesso é só para motoristas. Para o sistema completo, entre pela página principal do JB ERP.';
        mostrarMsg(f, msg); b.disabled = false; b.textContent = 'Entrar';
        if (sessao) { var t = sessao.access_token; esquecerSessao(); sessao = null; sb = null; post('logout', {}, t).catch(function () {}); }
      }
    });
  }
  function telaTrocar(r) {
    var f = caixa('Crie sua <em>senha</em>', 'Primeiro acesso de ' + (r.nome || 'motorista') + ': troque a senha provisória.', campoEnt('tA', 'Senha provisória', 'password', 'current-password') + campoEnt('tN', 'Nova senha (mínimo 8 caracteres)', 'password', 'new-password') + campoEnt('tR', 'Repita a nova senha', 'password', 'new-password'), 'Salvar nova senha');
    f.addEventListener('submit', async function (ev) {
      ev.preventDefault();
      var a = $('#tA', f).value, n = $('#tN', f).value, rr = $('#tR', f).value, b = $('button[type=submit]', f);
      if (n !== rr) { mostrarMsg(f, 'As duas senhas novas não são iguais.'); return; }
      b.disabled = true; mostrarMsg(f, '');
      try { await post('trocar-senha', { senhaAtual: a, senhaNova: n }, r.access_token); await post('logout', {}, r.access_token).catch(function () {}); telaEntrada('Senha criada. Entre agora com a senha nova.', true); }
      catch (e) { mostrarMsg(f, e.message); b.disabled = false; }
    });
  }

  /* ---------------- abertura ---------------- */
  async function iniciar() {
    if (!window.supabase || !window.supabase.createClient) { app.innerHTML = '<main><div class="aviso pe" style="margin-top:24px">' + ic('alerta') + '<div>Não foi possível abrir (falta a conexão com o servidor). Confira a internet e recarregue a página.</div></div><div class="btns"><button type="button" class="btn pri" onclick="location.reload()">Recarregar</button></div></main>'; return; }
    var guardada = null;
    try { guardada = JSON.parse(sessionStorage.getItem(K_PASS) || 'null'); sessionStorage.removeItem(K_PASS); } catch (e) {}
    if (!guardada) { try { guardada = JSON.parse(sessionStorage.getItem(K_SESS) || 'null'); } catch (e) {} }
    if (guardada && guardada.access_token && guardada.refresh_token) {
      try { await abrirSessao(guardada); return; }
      catch (e) { esquecerSessao(); sb = null; sessao = null; telaEntrada(e.code === 'rede' ? e.message : (/não é de motorista/i.test(e.message) ? 'Este acesso é só para motoristas.' : 'Entre de novo para continuar.')); return; }
    }
    telaEntrada('');
  }
  iniciar();
})();
</script>
